<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pemantauan Poktan NTT</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%; width: 100%;
      font-family: 'Poppins', sans-serif; background: #F8FAFC; overflow: hidden;
    }

    /* GANTI URL DI BAWAH INI dengan Web App URL asli project Anda
       (Deploy > Manage deployments > salin "Web app" URL, harus diakhiri /exec) */
    iframe {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }

    #loading-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #F8FAFC; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      transition: opacity 0.3s ease;
      z-index: 10;
    }
    #loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid #E2E8F0; border-top-color: #2563EB;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-overlay p { color: #64748B; font-size: 13px; font-weight: 500; margin: 0; }
  </style>
</head>
<body>

  <div id="loading-overlay">
    <div class="spinner"></div>
    <p>Memuat Dasbor Poktan NTT...</p>
  </div>

  <iframe
    id="app-frame"
    src="https://script.google.com/macros/s/AKfycbwO-kLMC3xJEMn6ZtR5-TgygpgnHLHVsQvbg3tQAvVb-Fj0LVKOi-UMxtD_VqNgKaGI/exec"
    onload="document.getElementById('loading-overlay').classList.add('hidden')"
    title="Dasbor Pemantauan Poktan NTT">
  </iframe>

</body>
</html>
